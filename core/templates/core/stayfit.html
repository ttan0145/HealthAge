<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stay Fit</title>
<link rel="stylesheet" href="/static/core/css/style.css?v=stayfit-api-layout">
</head>
<body class="lp-body">
  <div data-include="nav"></div>

  <main class="sf-main source-main stayfit-main">
    <header class="sf-header">
      <p class="eyebrow">Stay Fit</p>
      <h1 class="sf-title reading-title" id="routine-title">Today's routine</h1>
      <p class="sf-subtitle reading-lead" id="routine-subtitle">Loading your routine...</p>
    </header>

    <section class="sf-grid stayfit-layout" aria-label="Stay Fit routine workspace">
      <section class="sf-card sf-steps stayfit-column stayfit-column--list" aria-labelledby="exercise-list-title">
        <div class="stayfit-section-heading">
          <h2 id="exercise-list-title">Exercise order</h2>
          <span id="routine-level" class="mode-pill">Beginner</span>
        </div>
        <div id="exercise-list" class="routine-list routine-list--loading" aria-live="polite">
          <p>Loading exercises...</p>
        </div>
      </section>

      <section class="sf-card sf-timer-card timer-panel" aria-labelledby="timer-title">
        <p class="sf-timer-label timer-kicker" id="timer-title">Let's get moving</p>
        <div class="sf-ring-wrap timer-ring" aria-live="polite">
          <div class="sf-ring-center">
            <span class="sf-time" id="timer-display">06:00</span>
            <small class="sf-time-caption">Total time</small>
          </div>
        </div>
        <div class="sf-controls timer-controls">
          <button type="button" class="sf-pill-btn timer-mini-btn" id="timer-add-minute">+1 min</button>
          <label class="sf-num-field">
            <input class="sf-num-input" id="timer-minutes" type="number" min="1" max="60" value="6">
            <span class="sf-num-unit">min</span>
          </label>
          <label class="sf-num-field">
            <input class="sf-num-input" id="timer-seconds" type="number" min="0" max="59" value="0">
            <span class="sf-num-unit">sec</span>
          </label>
        </div>
        <div class="timer-actions">
          <button type="button" class="sf-start-btn btn-primary" id="timer-toggle">Start</button>
          <button type="button" class="btn-secondary" id="timer-reset">Reset</button>
        </div>
        <p id="timer-status" class="timer-status">Ready when you are.</p>
      </section>

      <aside class="sf-card sf-side-card guidance-panel" aria-labelledby="guidance-title">
        <div class="sf-mascot guidance-figure" aria-hidden="true">
          <img src="/static/img/grandpa.png" alt="">
        </div>
        <div class="sf-tip guidance-tip">
          <span class="guidance-icon" aria-hidden="true">i</span>
          <div>
            <h2 id="guidance-title">Tip</h2>
            <p id="guidance-copy">Move at your own pace and take breaks when you need to.</p>
          </div>
        </div>
        <p id="safety-note" class="guidance-safety"></p>
      </aside>
    </section>

    <p class="stayfit-source-note" id="guideline-note"></p>
  </main>

  <div class="exercise-modal" id="exercise-modal" hidden>
    <div class="exercise-modal-backdrop" data-modal-close></div>
    <section class="exercise-modal-panel" role="dialog" aria-modal="true" aria-labelledby="exercise-modal-title">
      <button type="button" class="exercise-modal-close" data-modal-close aria-label="Close exercise details">x</button>
      <p class="eyebrow" id="exercise-modal-category">Exercise detail</p>
      <h2 id="exercise-modal-title">Exercise</h2>
      <div id="exercise-modal-media" class="exercise-modal-media"></div>
      <dl class="exercise-meta" id="exercise-modal-meta"></dl>
      <h3>How to do it</h3>
      <p id="exercise-modal-instructions"></p>
      <p id="exercise-modal-source" class="exercise-modal-source"></p>
    </section>
  </div>

  <div data-include="footer"></div>
  <script src="/static/core/js/include.js"></script>
  <script src="/static/core/js/stayfit.js?v=stayfit-api-layout"></script>
</body>
</html>
