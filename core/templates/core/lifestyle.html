<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lifestyle habits</title>
<link rel="stylesheet" href="/static/core/css/style.css">
</head>
<body class="lp-body">

  <div data-include="nav"></div>

  <div class="onboard-shell">
    <div class="onboard-card">

      <a href="/profile/" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </a>

      <h1 class="onboard-heading">Lifestyle habits</h1>
      <div class="onboard-rule"></div>

      <p class="onboard-step">Step 2 of 2. Tap each one that applies to you. It's okay if several apply, there's no wrong answer.</p>

      <p class="chip-group-label">Which apply to you?</p>
      <div class="chip-group">
        <button type="button" class="chip">Smoking</button>
        <button type="button" class="chip chip--active">Rarely exercise</button>
        <button type="button" class="chip">Irregular meals</button>
        <button type="button" class="chip">Sleep late</button>
        <button type="button" class="chip chip--active">High work stress</button>
        <button type="button" class="chip chip--active">No recent screening</button>
      </div>

      <p class="chip-group-label">Family history of these conditions</p>
      <div class="chip-group">
        <button type="button" class="chip chip--active">Heart disease</button>
        <button type="button" class="chip">Diabetes</button>
        <button type="button" class="chip">Cancer</button>
      </div>

      <a href="/dashboard/" class="btn-primary btn-block">See my action plan</a>

    </div>
  </div>

  <div data-include="footer"></div>

  <script src="/static/core/js/include.js"></script>
  <script src="/static/core/js/onboard.js"></script>
</body>
</html>
